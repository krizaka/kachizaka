name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, caches, parallel legs, timeouts and
  # the gate that always reports live there. The required check is « ci / CI gate ».
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@1d506b702a30ad519ca2561b51bcb981fe680e8e # v1.5.2
    permissions:
      contents: read
    with:
      container: true      # the image is built on every PR that can break it (Dockerfile, manifests, lockfiles, COPY paths)
      container-dockerfile: deploy/docker/Dockerfile
      container-image: app:ci
      # What App Platform passes as build arguments: indexing off (a dev build), a placeholder commit.
      container-build-args: |
        APP_SEARCH_INDEXING=off
        APP_COMMIT_SHA=ci
      package-manager: pnpm
      parallel: true
      typecheck-script: typecheck
      next-cache-paths: apps/web/.next/cache
      postgres-image: postgres:16
      postgres-name: kachizaka
      # Test values only — no real secret anywhere. The database tests create a database per file on this server.
      env: |
        DATABASE_URL=postgresql://kachizaka:ci-only-password@localhost:5432/kachizaka
        DATABASE_IT=1
      playwright: chromium
      after-build: scripts/ci-after-build.sh
