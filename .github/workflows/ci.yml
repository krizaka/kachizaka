name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, caches, parallel legs, timeouts and
  # the gate that always reports live there. The required check is « ci / CI gate ».
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@d95527618e5b070cff81d248964290b732e31886 # v1.4.0
    permissions:
      contents: read
    with:
      package-manager: pnpm
      parallel: true
      typecheck-script: typecheck
      next-cache-paths: apps/web/.next/cache
      postgres-image: postgres:16
      postgres-name: kachizaka
      # Test values only — no real secret anywhere. The database tests create a database per file on this server.
      env: |
        DATABASE_URL=postgresql://kachizaka:ci-only-password@localhost:5432/kachizaka
        DATABASE_IT=1
      playwright: chromium
      after-build: scripts/ci-after-build.sh
