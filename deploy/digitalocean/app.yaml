# kachizaka dev — DigitalOcean App Platform (TOR1), smallest instance: dev.kachizaka.com. Secrets are DO SECRETs, filled from the
# maintainer's local secrets store (never committed): each __NAME__ below is replaced by the deploy session, then
#   doctl apps create --spec <rendered>   (or  doctl apps update <APP_ID> --spec <rendered>).
# The database is kachizaka_db on krizaka-dev-pg behind its PgBouncer pool (transaction mode, size 2); migrations run at start
# on the direct URL.
name: kachizaka-dev
region: tor
domains:
  # The public address (epic krizaka/.github#119): www is primary and indexed, the apex answers 308 with www (ingress below).
  - domain: www.kachizaka.com
    type: PRIMARY
  - domain: kachizaka.com
    type: ALIAS
  # The development address: every page goes to www (308); the API, .well-known and healthz keep serving, noindex (APP_DEV_HOST).
  - domain: dev.kachizaka.com
    type: ALIAS
  # The administration console: the same app, host-routed (lib/host.ts); session + ADMIN role + AUTH_ALLOWED_IPS.
  - domain: admin.kachizaka.com
    type: ALIAS
# The apex leads to www (308); the other hosts are the app's (dev's page redirect and noindex are the app's own: lib/indexing.ts).
ingress:
  rules:
    - match:
        authority:
          exact: kachizaka.com
      redirect:
        authority: www.kachizaka.com
        redirect_code: 308
    - match:
        path:
          prefix: /
      component:
        name: web
services:
  - name: web
    github:
      repo: krizaka/kachizaka
      branch: main
      deploy_on_push: true
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/healthz
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: APP_PUBLIC_URL
        scope: RUN_TIME
        value: https://www.kachizaka.com
      - key: APP_DEV_HOST
        scope: RUN_TIME
        value: dev.kachizaka.com
      - key: APP_COMMIT_SHA
        scope: BUILD_TIME
        value: ${_self.COMMIT_HASH}
      # Every dev deployment: noindex and a closed robots.txt on every host but www (the public address), the development notice in the footer.
      - key: APP_SEARCH_INDEXING
        scope: RUN_AND_BUILD_TIME
        value: "off"
      - key: AUTH_SIGNUP_ENABLED
        scope: RUN_TIME
        value: "false"
      # Only these client addresses (do-connecting-ip) reach admin.kachizaka.com, its sign-in included; empty = nobody.
      # (krizaka-deploy keeps the live value: the addresses are not committed.)
      - key: AUTH_ALLOWED_IPS
        scope: RUN_TIME
        value: __AUTH_ALLOWED_IPS__
      - key: AUTH_SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: __AUTH_SESSION_SECRET__
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: __DATABASE_URL__
      - key: DATABASE_DIRECT_URL
        scope: RUN_TIME
        type: SECRET
        value: __DATABASE_DIRECT_URL__
      # The scheduled results sync's bearer (.github/workflows/dev-sync.yml): live value kept.
      - key: OPERATOR_SYNC_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: __OPERATOR_SYNC_TOKEN__
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: __DATABASE_CA_CERT__
      # Connection budget (krizaka/.github#60): the cluster's pool for this database is 2 server connections, so one
      # process holds at most 2; one instance, so the realtime bus lives in memory (no LISTEN connection).
      - key: DATABASE_MAX_CONNECTIONS
        scope: RUN_TIME
        value: "1"
      - key: REALTIME_BUS
        scope: RUN_TIME
        value: memory
      - key: ABUSE_CLIENT_IP_HEADER
        scope: RUN_TIME
        value: do-connecting-ip
